<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Mutare Unitatem</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #222;
            text-align: center;
        }

        .container {
            margin-top: 120px;
            padding: 0 24px;
        }

        .title-en {
            font-size: 22px;
            font-weight: 600;
            color: #FF9500;
        }

        .title-ja {
            font-size: 16px;
            color: #555;
            margin-top: 6px;
        }

        .desc {
            margin-top: 28px;
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }

        .retry-btn {
            margin-top: 40px;
            padding: 12px 28px;
            background: #FF9500;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title-en">Offline Mode</div>
        <div class="title-ja">オフライン状態です</div>

        <p class="desc">
            現在ネットワークに接続されていません。<br>
            接続を確認して、もう一度お試しください。<br><br>
            You are currently offline.<br>
            Please check your connection and try again.
        </p>

        <button class="retry-btn" onclick="location.reload();">
            Retry / 再読み込み
        </button>
    </div>
</body>
</html>
