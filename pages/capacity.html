<body class="page-body">

    <!-- タイトル（中央上） -->
    <header class="page-header">
        <h1 class="page-title">
            <span class="title-ja">容量の換算</span>
        </h1>
    </header>

    <!-- 変換ペア選択（中央） -->
    <div class="unit-select-box">
        <select id="unitPair">

            <!-- 日常・料理系 -->
            <option value="ml-dl">ml ⇄ dL</option>
            <option value="dl-l">dL ⇄ L</option>
            <option value="ml-l">ml ⇄ L</option>
            <option value="l-kl">L ⇄ kL</option>

            <option value="ml-cc">ml ⇄ cc</option>
            <option value="l-cc">L ⇄ cc</option>

            <option value="ml-oz">ml ⇄ oz</option>
            <option value="l-cup">L ⇄ cup</option>

            <!-- ガソリン・石油系 -->
            <option value="l-gallon">L ⇄ gallon</option>
            <option value="l-barrel">L ⇄ barrel</option>
            <option value="gallon-barrel">gallon ⇄ barrel</option>

            <!-- 工業・大容量 -->
            <option value="l-m3">L ⇄ m³</option>
            <option value="ml-m3">ml ⇄ m³</option>

        </select>
    </div>

    <!-- 入力UI（中央） -->
    <div class="unit-box">
        <label id="labelA" class="unit-label">ml</label>
        <input type="number" id="inputA" class="unit-input" placeholder="0">

        <label id="labelB" class="unit-label">dL</label>
        <input type="number" id="inputB" class="unit-input" placeholder="0">
    </div>

    <!-- リセットボタン（中央下） -->
    <div class="reset-box">
        <button id="resetButton" class="reset-button">Reset</button>
    </div>
