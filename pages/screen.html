<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Size | Mutare Unitatem</title>
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>
<body class="page-body">

    <!-- タイトル（中央上） -->
    <header class="page-header">
        <h1 class="page-title">
            <span class="title-ja">画面サイズの換算</span>
        </h1>
    </header>

    <!-- 対角インチ入力 -->
    <div class="unit-box">
        <label class="unit-label">
            <span class="label-en">Diagonal (inch)</span>
            <span class="label-ja">対角（インチ）</span>
        </label>
        <input type="number" id="inchInput" class="unit-input" placeholder="0">
    </div>

    <!-- アスペクト比選択 -->
    <div class="unit-select-box">
        <select id="aspectRatio">
            <option value="16-9">16 : 9（一般的なテレビ・モニター）</option>
            <option value="4-3">4 : 3（古いモニター・一部タブレット）</option>
            <option value="19.5-9">19.5 : 9（スマートフォン）</option>
            <option value="21-9">21 : 9（ウルトラワイド）</option>
        </select>
    </div>

    <!-- 結果表示（対角cm・幅cm・高さcm） -->
    <div class="unit-box">
        <label class="unit-label">
            <span class="label-en">Diagonal (cm)</span>
            <span class="label-ja">対角（cm）</span>
        </label>
        <input type="text" id="cmDiagonal" class="unit-input" readonly>

        <label class="unit-label">
            <span class="label-en">Width (cm)</span>
            <span class="label-ja">幅（cm）</span>
        </label>
        <input type="text" id="cmWidth" class="unit-input" readonly>

        <label class="unit-label">
            <span class="label-en">Height (cm)</span>
            <span class="label-ja">高さ（cm）</span>
        </label>
        <input type="text" id="cmHeight" class="unit-input" readonly>
    </div>

    <!-- リセットボタン -->
    <div class="reset-box">
        <button id="resetButton" class="reset-button">Reset </button>
    </div>

    <!-- 下部ナビ（二言語） -->
<nav class="tabbar">
    <ul>

            <a href="../index.html">
                <img src="../icon_150381_64.png" alt="" class="nav-icon">
                <span class="nav-ja">ホーム</span>
            </a>
        </li>

        <li>
            <a href="length.html">
                <img src="../icon_000121_64.png" alt="" class="nav-icon">
                <span class="nav-ja">長さ</span>
            </a>
        </li>

        <li>
            <a href="weight.html">
                <img src="../icon_144531_64.png" alt="" class="nav-icon">
                <span class="nav-ja">重さ</span>
            </a>
        </li>

        <li>
            <a href="capacity.html">
                <img src="../icon_121911_64.png" alt="" class="nav-icon">
                <span class="nav-ja">容量</span>
            </a>
        </li>

        <!-- 現在ページ（画面サイズ）→ アイコンなし -->
    
        <li>
            <a href="golden.html">
                <img src="../icon_134021_64.png" alt="" class="nav-icon">
                <span class="nav-ja">黄金比</span>
            </a>
        </li>
    </ul>
</nav>


    <script src="../js/screen.js"></script>
</body>

</html>
